[project]
name = "careerbrain"
version = "0.1.0"
description = "Personal career knowledge base with an ingest script and MCP server"
readme = "Readme.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4",
    "fastapi>=0.110",
    "httpx>=0.27",
    "markdown>=3.6",
    "mcp>=1.2,<2",
    "pyyaml>=6",
    "slack-bolt>=1.18",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careerbrain"]
