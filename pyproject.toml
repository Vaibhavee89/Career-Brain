[project]
name = "careerbrain"
version = "0.1.0"
description = "Personal career knowledge base with an ingest script and MCP server"
readme = "Readme.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "mcp>=1.2,<2", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careerbrain"]
