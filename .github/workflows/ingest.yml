name: Weekly ingest

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: code

      - uses: actions/checkout@v4
        with:
          repository: Vaibhavee89/careerbrain-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        working-directory: code
        run: uv sync --frozen --no-dev

      - name: Ingest and generate
        working-directory: code
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: Vaibhavee89
        run: >
          uv run python -m careerbrain.ingest
          --root "$GITHUB_WORKSPACE/data"
          --summary "${{ runner.temp }}/summary.md"

      - uses: peter-evans/create-pull-request@v7
        with:
          path: data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          branch: ingest/weekly
          title: "Weekly ingest"
          body-path: ${{ runner.temp }}/summary.md
          commit-message: "Weekly ingest"
