# Career Brain configuration.
# Read by the (future) ingest script and MCP server. For now this just
# documents the repo's conventions so later tooling has one source of truth.

paths:
  profile: profile/
  projects: projects/
  experience: experience/
  decisions: decisions/
  learning: learning/
  job_search: job-search/
  inbox: inbox/
  wins: wins.md

# Every page's frontmatter should set `public: true` or `public: false`.
# Only `public: true` pages may ever be included in a generated public
# site, resume export, or /ask-me chat. Default to false until reviewed.
publish:
  default_visibility: false

# Phase roadmap (see README.md for details). Update as phases complete.
phases:
  - id: 1
    name: "Structure + seed pages"
    status: in_progress
  - id: 2
    name: "Ingest script + weekly PR workflow"
    status: planned
  - id: 3
    name: "MCP server (search_brain, get_page, get_resume, recent_wins)"
    status: planned
  - id: 4
    name: "Public site + /ask-me chat"
    status: planned
