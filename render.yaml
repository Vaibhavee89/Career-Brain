services:
  - type: web
    name: careerbrain-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: CAREERBRAIN_DATA_TOKEN
        sync: false # fine-grained token, read-only on careerbrain-data
      - key: CAREERBRAIN_DATA_REPO
        value: Vaibhavee89/careerbrain-data
      - key: CAREERBRAIN_CORS_ORIGINS
        value: https://vaibhavee89.github.io,https://career-brain-ui.vercel.app
      - key: CAREERBRAIN_TRUSTED_PROXIES
        sync: false # Render's proxy range, so rate limits see real client IPs
      - key: CAREERBRAIN_RESUME_URL
        value: https://drive.google.com/file/d/1IzXQ3ka1ka4yWiVyvfJUAgdh8WJnj6tk/view?usp=sharing # downloadable CV the chat shares
      - key: PINECONE_API_KEY
        sync: false # Pinecone key; set in the Render dashboard, never in git
      - key: PINECONE_INDEX_HOST
        value: career-brain-9iiftb6.svc.aped-4627-b74a.pinecone.io # index that holds the public pages
      - key: CAREERBRAIN_SITE_URL
        value: https://vaibhavee89.github.io/Career-Brain # used to build page links in replies
